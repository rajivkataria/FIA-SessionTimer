<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Timer Overlay</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: rgba(0, 0, 0, 0.2); /* slight tint so you can see it */
      color: #f7f2fa;
      font: 600 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .overlay-root {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      box-sizing: border-box;
    }

    .ov-title {
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .ov-name {
      font-size: 32px;
      font-weight: 700;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .ov-status {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .ov-time {
      font-size: 80px;
      letter-spacing: 0.06em;
      text-shadow: 0 0 18px rgba(255, 214, 229, 0.3);
    }

    .ov-footer {
      position: fixed;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.6;
    }

    .ov-key {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      margin: 0 2px;
    }

    .ov-warning {
      margin-top: 6px;
      font-size: 12px;
      color: #ffb3c1;
    }
  </style>
</head>
<body>
  <div class="overlay-root">
    <div class="ov-title" id="ovSessionTitle">Session</div>
    <div class="ov-name" id="ovName">—</div>
    <div class="ov-status" id="ovStatus">Paused</div>
    <div class="ov-time" id="ovTime">00:00</div>
    <div class="ov-warning" id="ovWarning" style="display:none;"></div>
  </div>

  <div class="ov-footer">
    Controls from overlay:
    <span class="ov-key">Space</span> start/pause ·
    <span class="ov-key">N</span> next ·
    <span class="ov-key">+</span> +1 min ·
    <span class="ov-key">R</span> reset ·
    <span class="ov-key">M</span> mute
  </div>

  <script>
    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function fmtSeconds(sec) {
      sec = Math.max(0, Math.round(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return pad2(m) + ":" + pad2(s);
    }

    function getAPI() {
      try {
        return window.opener && window.opener.TimerAPI ? window.opener.TimerAPI : null;
      } catch (e) {
        return null;
      }
    }

    const nameEl   = document.getElementById("ovName");
    const timeEl   = document.getElementById("ovTime");
    const statusEl = document.getElementById("ovStatus");
    const titleEl  = document.getElementById("ovSessionTitle");
    const warnEl   = document.getElementById("ovWarning");

    function updateOverlay() {
      const api = getAPI();
      if (!api) {
        nameEl.textContent   = "Timer window not found";
        timeEl.textContent   = "00:00";
        statusEl.textContent = "Open the main Session Timer tab first.";
        warnEl.style.display = "block";
        warnEl.textContent   = "This overlay needs the main timer window to stay open.";
        return;
      }

      const state = api.getState();
      const speakers = state.speakers || [];
      const idx = state.idx || 0;
      const cur = speakers[idx] || null;

      // Title
      let metaTitle = state.sessionTitle || "Session";
      if (state.sections && state.sections.length) {
        const secIdx = state.currentSectionIdx || 0;
        const sec = state.sections[secIdx];
        if (sec) {
          const label = sec.title || ("Section " + (secIdx + 1));
          metaTitle += " — " + label;
        }
      }
      titleEl.textContent = metaTitle;

      // Name + time
      nameEl.textContent = cur ? cur.name : "—";
      const remainingSec = cur ? cur.remainingSec : 0;
      timeEl.textContent = fmtSeconds(remainingSec);

      // Status
      const isRunning = !!state.running;
      statusEl.textContent = isRunning ? "Running" : "Paused";

      // Simple subtle warn if < 1 min
      if (remainingSec <= 60 && remainingSec > 0) {
        warnEl.style.display = "block";
        warnEl.textContent = "Less than 1 minute left";
      } else if (remainingSec <= 0 && cur) {
        warnEl.style.display = "block";
        warnEl.textContent = "Time — please wrap";
      } else {
        warnEl.style.display = "none";
      }
    }

    // Keep polling main window
    setInterval(updateOverlay, 200);
    updateOverlay();

    // Hotkeys from overlay that call back into the main timer
    document.addEventListener("keydown", (e) => {
      const api = getAPI();
      if (!api) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      const k = e.key.toLowerCase();
      if (k === " ") {
        e.preventDefault();
        api.toggleStart();
      } else if (k === "n") {
        api.nextSpeaker();
      } else if (k === "+") {
        api.extendOne();
      } else if (k === "r") {
        api.resetAll();
      } else if (k === "m") {
        api.toggleMute();
      } else if (k >= "1" && k <= "9") {
        const idx = parseInt(k, 10) - 1;
        api.jump(idx);
      }
    });
  </script>
</body>
</html>

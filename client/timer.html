<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.js"></script>
  <title>Session Timer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #120f16; --surface: #191625; --surface-2: #221c33;
      --text: #f7f2fa; --muted: #cbbfd7; --accent: #b583c6;
      --accent-ghost: #2c2140; --line: #2b2340; --digits: #ffd6e5;
    }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 600 16px/1.45 system-ui; }
    .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel { background: var(--surface); border: 1px solid var(--accent-ghost); border-radius: 16px; padding: 18px 20px; overflow: hidden; }
    .name { font-size: 42px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .big { font-size: 96px; color: var(--digits); transition: color 0.3s; }
    .big.overtime { color: #ff6b6b; animation: flash 0.8s infinite alternate; }
    @keyframes flash { from { opacity: 1; } to { opacity: 0.4; } }
    button { background: var(--surface-2); color: var(--text); border: 1px solid var(--accent-ghost); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
    .primary { background: #d0a6e6; color: #2b1736; }
    .warn { background: #ffb3c1; color: #2d0f17; }
    body.viewer .top { display: none; }

    /* Modal */
    #nameModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    #nameModal.open { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--accent-ghost); border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; min-width: 300px; }
    .modal-box h2 { margin: 0; font-size: 22px; }
    .modal-box input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 10px 14px; font-size: 16px; font-family: inherit; outline: none; }
    .modal-box input:focus { border-color: var(--accent); }
    .modal-box button { align-self: flex-end; }

    /* Video */
    #videoContainer { width: 100%; height: 60vh; display: grid; gap: 8px; padding: 10px; background: #000; box-sizing: border-box; grid-auto-rows: 1fr; align-items: stretch; }
    .video-tile { position: relative; width: 100%; height: 100%; min-height: 0; background: #111; border-radius: 12px; overflow: hidden; transition: box-shadow 0.15s; }
    .video-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; pointer-events: none; backdrop-filter: blur(4px); z-index: 2; }
    .tile-timer { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.55); color: #ffd6e5; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 8px; pointer-events: none; backdrop-filter: blur(4px); z-index: 2; }
    .tile-timer.overtime { color: #ff6b6b; }
    .video-tile.speaking { box-shadow: 0 0 0 3px #b583c6, 0 0 18px 4px rgba(181,131,198,0.45); }
    .video-tile.overtime-tile { box-shadow: 0 0 0 3px #ff6b6b, 0 0 18px 4px rgba(255,107,107,0.45); }

    /* Dashboard */
    .wrap { height: 35vh; display: grid; grid-template-columns: 520px 1fr; gap: 22px; padding: 18px; box-sizing: border-box; }
    .speakers-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: calc(35vh - 80px); }
    .speakers-list li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
    .speakers-list li.active-speaker { background: var(--accent-ghost); border: 1px solid var(--accent); }
    .speakers-list li .sp-name { flex: 1; }
    .speakers-list li .sp-time { font-size: 13px; color: var(--digits); font-variant-numeric: tabular-nums; }
    .speakers-list li .sp-time.overtime { color: #ff6b6b; }
    .panel-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div id="nameModal">
    <div class="modal-box">
      <h2>Join Session</h2>
      <input id="nameInput" type="text" placeholder="Your name" maxlength="40" />
      <button class="primary" id="joinBtn">Join</button>
    </div>
  </div>

  <div id="videoContainer"></div>

  <div class="top">
    <button onclick="startJoin()">Join Video</button>
    <button id="sessionBtn" style="background:#7c3aed;color:#fff;border-color:#6d28d9" onclick="toggleSession()">&#9654; Start Session</button>
    <button onclick="extendCurrent()">+1 min</button>
    <button class="warn" onclick="resetAll()">Reset</button>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="panel-label">Now Speaking</div>
      <div id="curName" class="name">&#8212;</div>
      <div id="curTime" class="big">05:00</div>
    </div>
    <div class="panel">
      <div class="panel-label">Speakers</div>
      <ul class="speakers-list" id="speakersList"></ul>
    </div>
  </div>

  <script>
    const videoContainer = document.getElementById("videoContainer");
    const nameModal  = document.getElementById("nameModal");
    const nameInput  = document.getElementById("nameInput");
    const joinBtn    = document.getElementById("joinBtn");
    const sessionBtn = document.getElementById("sessionBtn");
    const curName    = document.getElementById("curName");
    const curTime    = document.getElementById("curTime");
    const speakersList = document.getElementById("speakersList");

    /* ---- SOCKET ---- */
    const socket = io("http://localhost:5000");
    const roomId = "room1";

    /* ---- SPEAKER REGISTRY ---- */
    // name -> { remainingMs, totalMs }
    const DEFAULT_MS = 5 * 60 * 1000;
    const speakerTimes = new Map();
    let activeSpeakerName = null;   // name of current speaker
    let lastTickTime = null;        // timestamp of last VAD tick

    function ensureSpeaker(name) {
      if (!speakerTimes.has(name)) {
        speakerTimes.set(name, { remainingMs: DEFAULT_MS, totalMs: DEFAULT_MS });
        pushSpeakersToServer();
      }
    }

    function removeSpeaker(name) {
      speakerTimes.delete(name);
      if (activeSpeakerName === name) { activeSpeakerName = null; lastTickTime = null; }
      pushSpeakersToServer();
      renderDashboard();
    }

    function pushSpeakersToServer() {
      // Keep server in sync so it knows speaker order
      socket.emit("set_speakers", { roomId, speakers: [...speakerTimes.keys()] });
    }

    /* ---- TILES ---- */
    const tiles = new Map(); // identity -> { wrapper, labelEl, timerEl, analyser, name }
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function createTile(identity, displayName) {
      if (tiles.has(identity)) return tiles.get(identity).wrapper;
      const wrapper = document.createElement("div");
      wrapper.className = "video-tile";
      const label = document.createElement("div");
      label.className = "tile-label";
      label.textContent = displayName;
      const timerEl = document.createElement("div");
      timerEl.className = "tile-timer";
      timerEl.textContent = "5:00";
      wrapper.appendChild(timerEl);
      wrapper.appendChild(label);
      tiles.set(identity, { wrapper, labelEl: label, timerEl, analyser: null, name: displayName });
      videoContainer.appendChild(wrapper);
      updateVideoLayout();
      return wrapper;
    }

    function putVideoInTile(identity, videoEl) {
      const t = tiles.get(identity);
      if (!t || t.wrapper.querySelector("video")) return;
      t.wrapper.insertBefore(videoEl, t.wrapper.querySelector(".tile-timer"));
    }

    function hookAnalyserToStream(identity, stream) {
      const t = tiles.get(identity);
      if (!t || t.analyser) return;
      try {
        const ctx = getAudioCtx();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.6;
        src.connect(analyser);
        t.analyser = analyser;
      } catch(e) { console.warn("analyser failed", e); }
    }

    function hookAnalyserToLKTrack(identity, lkTrack) {
      try { hookAnalyserToStream(identity, new MediaStream([lkTrack.mediaStreamTrack])); }
      catch(e) { console.warn("lk analyser failed", e); }
    }

    function getRMS(analyser) {
      if (!analyser) return 0;
      const buf = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i]-128)/128; sum += v*v; }
      return Math.sqrt(sum / buf.length);
    }

    /* ---- MODAL ---- */
    function startJoin() {
      nameInput.value = "";
      nameModal.classList.add("open");
      setTimeout(() => nameInput.focus(), 50);
    }

    joinBtn.addEventListener("click", async () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      joinBtn.disabled = true;
      joinBtn.textContent = "Getting camera...";
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch(e) {
        alert("Camera/mic denied: " + e.message);
        joinBtn.disabled = false; joinBtn.textContent = "Join"; return;
      }
      nameModal.classList.remove("open");
      joinBtn.disabled = false; joinBtn.textContent = "Join";
      continueJoin(name, stream);
    });

    nameInput.addEventListener("keydown", e => { if (e.key === "Enter") joinBtn.click(); });

    /* ---- JOIN ---- */
    async function continueJoin(username, localStream) {
      videoContainer.innerHTML = "";
      tiles.clear();
      speakerTimes.clear();

      // Local tile — show immediately
      const LOCAL_ID = "__local__";
      const cleanName = username.replace(" (you)", "");
      createTile(LOCAL_ID, username + " (you)");
      ensureSpeaker(cleanName);

      const selfVid = document.createElement("video");
      selfVid.srcObject = localStream;
      selfVid.autoplay = true; selfVid.muted = true; selfVid.playsInline = true;
      putVideoInTile(LOCAL_ID, selfVid);
      hookAnalyserToStream(LOCAL_ID, localStream);

      // Update tile map name for VAD lookup
      const lt = tiles.get(LOCAL_ID);
      if (lt) lt.name = cleanName;

      // LiveKit
      let data;
      try {
        const res = await fetch("/get-token?room=" + roomId + "&username=" + encodeURIComponent(username));
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
      } catch(e) { alert("Token error: " + e.message); return; }

      const room = new LivekitClient.Room();
      try {
        await room.connect("wss://therapyapp-4n3fl2as.livekit.cloud", data.token);
        console.log("Connected as", username);
      } catch(e) { alert("LiveKit error: " + e.message); return; }

      try {
        const vt = localStream.getVideoTracks()[0];
        const at = localStream.getAudioTracks()[0];
        if (vt) await room.localParticipant.publishTrack(vt);
        if (at) await room.localParticipant.publishTrack(at);
      } catch(e) { console.warn("publish failed", e); }

      // Already-present remote participants
      room.remoteParticipants.forEach(participant => {
        const id = participant.identity;
        const pName = participant.name || id;
        createTile(id, pName);
        const rt = tiles.get(id);
        if (rt) rt.name = pName;
        ensureSpeaker(pName);
        participant.trackPublications.forEach(pub => {
          if (!pub.isSubscribed || !pub.track) return;
          if (pub.kind === "video") putVideoInTile(id, pub.track.attach());
          if (pub.kind === "audio") hookAnalyserToLKTrack(id, pub.track);
        });
      });

      // New remote track
      room.on("trackSubscribed", (track, _pub, participant) => {
        const id = participant.identity;
        const pName = participant.name || id;
        createTile(id, pName);
        const rt = tiles.get(id);
        if (rt) rt.name = pName;
        ensureSpeaker(pName);
        if (track.kind === "video") putVideoInTile(id, track.attach());
        if (track.kind === "audio") hookAnalyserToLKTrack(id, track);
        renderDashboard();
      });

      // Participant leaves
      room.on("participantDisconnected", participant => {
        const id = participant.identity;
        const t = tiles.get(id);
        if (t) {
          removeSpeaker(t.name);
          t.wrapper.remove();
          tiles.delete(id);
          updateVideoLayout();
        }
      });

      renderDashboard();
    }

    /* ---- LAYOUT ---- */
    function updateVideoLayout() {
      const count = videoContainer.children.length;
      if (count === 0) return;
      const cols = count === 1 ? 1 : count <= 4 ? 2 : count <= 9 ? 3 : 4;
      videoContainer.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
      videoContainer.style.gridTemplateRows = "repeat(" + Math.ceil(count/cols) + ", 1fr)";
    }

    /* ---- VAD + TIMER ---- */
    const THRESHOLD = 0.015;
    const GRACE_MS  = 2500;
    let sessionActive = false, vadInterval = null, silenceTimer = null;

    function toggleSession() {
      if (!sessionActive) {
        if (audioCtx) audioCtx.resume();
        lastTickTime = null;
        vadInterval = setInterval(vadTick, 100);
        sessionBtn.innerHTML = "&#9646;&#9646; Stop Session";
        sessionBtn.style.background = "#be123c";
        sessionBtn.style.borderColor = "#9f1239";
      } else {
        clearInterval(vadInterval); clearTimeout(silenceTimer);
        vadInterval = silenceTimer = null;
        activeSpeakerName = null; lastTickTime = null;
        tiles.forEach(t => { t.wrapper.classList.remove("speaking", "overtime-tile"); });
        sessionBtn.innerHTML = "&#9654; Start Session";
        sessionBtn.style.background = "#7c3aed";
        sessionBtn.style.borderColor = "#6d28d9";
      }
      sessionActive = !sessionActive;
    }

    function vadTick() {
      let loudId = null, loudRMS = THRESHOLD;
      tiles.forEach((t, id) => {
        const rms = getRMS(t.analyser);
        if (rms > loudRMS) { loudRMS = rms; loudId = id; }
      });

      const now = Date.now();

      if (loudId) {
        clearTimeout(silenceTimer); silenceTimer = null;
        const t = tiles.get(loudId);
        const spName = t ? t.name : null;

        // Deduct time from whoever was speaking since last tick
        if (activeSpeakerName && lastTickTime) {
          const elapsed = now - lastTickTime;
          const sp = speakerTimes.get(activeSpeakerName);
          if (sp) {
            sp.remainingMs = Math.max(-60000, sp.remainingMs - elapsed); // allow 1 min overtime
          }
        }
        lastTickTime = now;

        // Switch active speaker if changed
        if (spName && spName !== activeSpeakerName) {
          activeSpeakerName = spName;
        }
      } else {
        // Silence — deduct from last speaker until grace period expires
        if (activeSpeakerName && lastTickTime && !silenceTimer) {
          silenceTimer = setTimeout(() => {
            activeSpeakerName = null; lastTickTime = null; silenceTimer = null;
            renderDashboard();
          }, GRACE_MS);
        }
        // Still deduct during grace period
        if (activeSpeakerName && lastTickTime) {
          const elapsed = now - lastTickTime;
          const sp = speakerTimes.get(activeSpeakerName);
          if (sp) sp.remainingMs = Math.max(-60000, sp.remainingMs - elapsed);
          lastTickTime = now;
        }
      }

      // Update tile visuals
      tiles.forEach((t, id) => {
        const rms = getRMS(t.analyser);
        const isActive = t.name === activeSpeakerName;
        const isSpeaking = rms > THRESHOLD;
        t.wrapper.classList.toggle("speaking", isSpeaking);

        // Update per-tile timer badge
        const sp = speakerTimes.get(t.name);
        if (sp) {
          const rem = sp.remainingMs;
          const isOT = rem < 0;
          const absSec = Math.floor(Math.abs(rem) / 1000);
          t.timerEl.textContent = (isOT ? "-" : "") + String(Math.floor(absSec/60)).padStart(2,"0") + ":" + String(absSec%60).padStart(2,"0");
          t.timerEl.classList.toggle("overtime", isOT);
          t.wrapper.classList.toggle("overtime-tile", isOT && isActive);
        }
      });

      renderDashboard();
    }

    /* ---- DASHBOARD ---- */
    function renderDashboard() {
      speakersList.innerHTML = "";
      speakerTimes.forEach((sp, name) => {
        const isOT = sp.remainingMs < 0;
        const absSec = Math.floor(Math.abs(sp.remainingMs) / 1000);
        const timeStr = (isOT ? "-" : "") + String(Math.floor(absSec/60)).padStart(2,"0") + ":" + String(absSec%60).padStart(2,"0");
        const li = document.createElement("li");
        if (name === activeSpeakerName) li.classList.add("active-speaker");
        li.innerHTML = '<span class="sp-name">' + name + '</span><span class="sp-time' + (isOT ? " overtime" : "") + '">' + timeStr + '</span>';
        speakersList.appendChild(li);
      });

      // Big display — show active speaker or first speaker
      const displayName = activeSpeakerName || [...speakerTimes.keys()][0] || null;
      if (displayName) {
        curName.textContent = displayName;
        const sp = speakerTimes.get(displayName);
        if (sp) {
          const isOT = sp.remainingMs < 0;
          const absSec = Math.floor(Math.abs(sp.remainingMs) / 1000);
          curTime.textContent = (isOT ? "-" : "") + String(Math.floor(absSec/60)).padStart(2,"0") + ":" + String(absSec%60).padStart(2,"0");
          curTime.classList.toggle("overtime", isOT);
        }
      } else {
        curName.textContent = "\u2014";
        curTime.textContent = "05:00";
        curTime.classList.remove("overtime");
      }
    }

    /* ---- CONTROLS ---- */
    function extendCurrent() {
      if (!activeSpeakerName) return;
      const sp = speakerTimes.get(activeSpeakerName);
      if (sp) { sp.remainingMs += 60000; renderDashboard(); }
    }

    function resetAll() {
      speakerTimes.forEach((sp, name) => { sp.remainingMs = sp.totalMs; });
      activeSpeakerName = null; lastTickTime = null;
      renderDashboard();
    }

    /* ---- VIEWER MODE ---- */
    const params = new URLSearchParams(window.location.search);
    const viewerMode = params.get("view") === "1";
    if (viewerMode) document.body.classList.add("viewer");
    if (viewerMode) setTimeout(startJoin, 500);

    socket.emit("join_room", { roomId, name: viewerMode ? "Viewer" : "Host", role: viewerMode ? "viewer" : "host" });
  </script>
</body>
</html>
